[project]
name = "buildathan"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kumara Guru", email = "kumaraguruj@aditi.com" }
]
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu>=1.8,<2.0",
    "langchain>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langchain-openai>=0.2,<0.4",
    "langchain-text-splitters>=0.3,<1.0",
    "pypdf>=5,<7",
    "streamlit>=1.37,<2.0",
]

[project.scripts]
buildathan = "buildathan:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
